trigger: none
pr: none

parameters:
  # Por defecto dev: un run lanzado sin tocar parametros no despliega en PRE ni PRO (AB#101582).
  - name: targetEnvironment
    type: string
    default: dev
    values:
      - dev
      - pre
      - prod

variables:
  # Variables por entorno (conexion, recursos, endpoints y valores segun dev/pre/prod).
  - template: pipelines/templates/variables/entorno.yml
    parameters:
      environment: ${{ parameters.targetEnvironment }}
  # Endpoints de IA por entorno (AI_*): fuente unica compartida con azure-pipelines-functions.yml.
  - template: infra/ai/pipeline-variables.yml
    parameters:
      targetEnvironment: ${{ parameters.targetEnvironment }}
  - name: buildConfiguration
    value: Release
  - name: solutionPath
    value: src/backend/DocumentIA.sln
  - name: functionsProject
    value: src/backend/DocumentIA.Functions/DocumentIA.Functions.csproj
  - name: adminProject
    value: src/frontend/DocumentIA.Admin/DocumentIA.Admin.csproj
  - name: assetResolverProject
    value: src/plugins/DocumentIA.AssetResolver/DocumentIA.AssetResolver.csproj
  - name: testsProject
    value: src/backend/DocumentIA.Tests.Unit/DocumentIA.Tests.Unit.csproj
  # GDC (endpoint por entorno via GDC_ENDPOINT; timeout constante)
  - name: gdcTimeoutSeconds
    value: '60'
  # CU Resiliencia baseline (post-2026-06-01)
  - name: cuMaxConcurrentCalls
    value: '4'
  - name: cuHardTimeoutSeconds
    value: '90'
  - name: cuEnableCircuitBreaker
    value: 'true'
  - name: cuCircuitBreakerFailureThreshold
    value: '5'
  - name: cuCircuitBreakerOpenSeconds
    value: '45'
  - name: cuMaxRetries
    value: '3'
  - name: cuInitialRetryDelayMs
    value: '500'
  - name: promptTracingEnabled
    value: 'true'
  - name: promptTracingIncludePromptText
    value: 'true'
  - name: promptTracingMaxPromptTextChars
    value: '20000'
  # dedupModoEstricto: interruptor de la reutilizacion por clave de intencion (AB#100930). 'false' vuelve a la regla anterior por modo y nivel sin deshacer datos.
  - name: dedupModoEstricto
    value: 'true'
  # gcHeapHardLimitPercent: tope del heap del GC por proceso (28 = 40 %), igual que el 802 (AB#100814); lo exige el contrato (AB#100983).
  - name: gcHeapHardLimitPercent
    value: '28'
  # Retencion de blobs (AB#100983): el trigger lee el cron de un app setting y appsettings.json no se carga en Functions.
  - name: blobRetentionCleanupCron
    value: '0 0 3 * * *'
  - name: blobRetentionDefaultDays
    value: '2'
  # RBAC de Key Vault: 'false' = el pipeline solo VERIFICA que la MI ya tiene
  # 'Key Vault Secrets User' (pre-asignado con scripts/configuration/assign-keyvault-rbac.ps1).
  # 'true' = el pipeline intenta crear la asignacion (requiere que el SP tenga permiso RBAC).
  - name: manageKeyVaultRbac
    value: 'false'

pool:
  vmImage: windows-latest

stages:
  - stage: Build
    displayName: Build & Test
    jobs:
      - job: BuildJob
        displayName: Build solution
        steps:
          # Compila, prueba y publica los tres artefactos.
          - template: pipelines/templates/steps/build-solucion.yml
            parameters:
              solutionPath: '$(solutionPath)'
              buildConfiguration: '$(buildConfiguration)'
              testsProject: '$(testsProject)'
              functionsProject: '$(functionsProject)'
              adminProject: '$(adminProject)'
              assetResolverProject: '$(assetResolverProject)'

  - stage: RunMigrations
    displayName: Run Database Migrations
    dependsOn: Build
    condition: false
    jobs:
      - job: MigrateJob
        displayName: Apply EF Core migrations
        pool:
          vmImage: windows-latest
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 9 SDK
            inputs:
              packageType: sdk
              version: 9.x

          - task: AzureKeyVault@2
            displayName: Fetch SQL connection string from Key Vault
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              KeyVaultName: $(KEY_VAULT_NAME)
              SecretsFilter: SqlConnectionString
              RunAsPreJob: false

          - pwsh: |
              $ErrorActionPreference = 'Stop'

              Write-Host "Installing dotnet-ef..."
              dotnet tool update --global dotnet-ef --version 9.* || dotnet tool install --global dotnet-ef --version 9.*

              $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

              Write-Host "Dotnet info:"
              dotnet --info

              Write-Host "dotnet-ef version:"
              dotnet ef --version

              Write-Host "Restoring solution..."
              dotnet restore $(solutionPath)

              Write-Host "Building solution..."
              dotnet build $(solutionPath) --configuration $(buildConfiguration) --no-restore

              Write-Host "Applying EF Core migrations against database..."
              dotnet ef database update `
                --project src/backend/DocumentIA.Data/ `
                --startup-project src/backend/DocumentIA.Functions/ `
                --configuration $(buildConfiguration) `
                --connection "$(SqlConnectionString)"
            displayName: Apply EF Core migrations

  - stage: DeployFunctions
    displayName: Deploy Functions
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployFunctionsJob
        displayName: Deploy to ${{ variables.AZURE_FUNCTIONS_APP_NAME }}
        environment: ${{ parameters.targetEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                # Despliega la Function App, aplica sus app settings y verifica los decisivos.
                - template: pipelines/templates/steps/deploy-functions.yml
                  parameters:
                    serviceConnection: '$(AZURE_SERVICE_CONNECTION)'
                    functionAppName: '$(AZURE_FUNCTIONS_APP_NAME)'
                    resourceGroup: '$(AZURE_RESOURCE_GROUP)'
                    keyVaultName: '$(KEY_VAULT_NAME)'
                    assetResolverBaseUrl: '$(AZURE_ASSET_RESOLVER_BASE_URL)'
                    aiOpenaiPrimaryEndpoint: '$(AI_OPENAI_PRIMARY_ENDPOINT)'
                    aiCuPrimaryEndpoint: '$(AI_CU_PRIMARY_ENDPOINT)'
                    aiCuSecondaryEndpoint: '$(AI_CU_SECONDARY_ENDPOINT)'
                    aiDiEndpoint: '$(AI_DI_ENDPOINT)'
                    cuMaxConcurrentCalls: '$(cuMaxConcurrentCalls)'
                    cuHardTimeoutSeconds: '$(cuHardTimeoutSeconds)'
                    cuEnableCircuitBreaker: '$(cuEnableCircuitBreaker)'
                    cuCircuitBreakerFailureThreshold: '$(cuCircuitBreakerFailureThreshold)'
                    cuCircuitBreakerOpenSeconds: '$(cuCircuitBreakerOpenSeconds)'
                    cuMaxRetries: '$(cuMaxRetries)'
                    cuInitialRetryDelayMs: '$(cuInitialRetryDelayMs)'
                    promptTracingEnabled: '$(promptTracingEnabled)'
                    promptTracingIncludePromptText: '$(promptTracingIncludePromptText)'
                    promptTracingMaxPromptTextChars: '$(promptTracingMaxPromptTextChars)'
                    gdcEndpoint: '$(GDC_ENDPOINT)'
                    diUseInlineContent: '$(DI_USE_INLINE_CONTENT)'
                    dedupModoEstricto: '$(dedupModoEstricto)'
                    promptDefaultsModelKey: '$(PROMPT_DEFAULTS_MODEL_KEY)'
                    gcHeapHardLimitPercent: '$(gcHeapHardLimitPercent)'
                    blobRetentionCleanupCron: '$(blobRetentionCleanupCron)'
                    blobRetentionDefaultDays: '$(blobRetentionDefaultDays)'
                    blobRetentionBatchSize: '$(BLOB_RETENTION_BATCH_SIZE)'
                    gdcTimeoutSeconds: '$(gdcTimeoutSeconds)'
                    environmentName: '$(ENVIRONMENT_NAME)'
      - deployment: DeployAdminJob
        displayName: Deploy to ${{ variables.AZURE_ADMIN_WEB_APP_NAME }}
        environment: ${{ parameters.targetEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                # Despliega el Admin, asegura identidad y RBAC de Key Vault y aplica sus app settings.
                - template: pipelines/templates/steps/deploy-admin.yml
                  parameters:
                    serviceConnection: '$(AZURE_SERVICE_CONNECTION)'
                    adminWebAppName: '$(AZURE_ADMIN_WEB_APP_NAME)'
                    functionAppName: '$(AZURE_FUNCTIONS_APP_NAME)'
                    resourceGroup: '$(AZURE_RESOURCE_GROUP)'
                    keyVaultName: '$(KEY_VAULT_NAME)'
                    manageKeyVaultRbac: '$(manageKeyVaultRbac)'
                    targetEnvironment: ${{ parameters.targetEnvironment }}

  - stage: DeployAssetResolver
    displayName: Deploy AssetResolver Plugin
    dependsOn: DeployFunctions
    condition: succeeded()
    jobs:
      - deployment: DeployAssetResolverJob
        displayName: Deploy to ${{ variables.AZURE_ASSET_RESOLVER_WEB_APP_NAME }}
        environment: ${{ parameters.targetEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                # Despliega el AssetResolver y aplica sus app settings.
                - template: pipelines/templates/steps/deploy-assetresolver.yml
                  parameters:
                    serviceConnection: '$(AZURE_SERVICE_CONNECTION)'
                    assetResolverWebAppName: '$(AZURE_ASSET_RESOLVER_WEB_APP_NAME)'
                    resourceGroup: '$(AZURE_RESOURCE_GROUP)'
                    keyVaultName: '$(KEY_VAULT_NAME)'

  - stage: ValidateConfiguration
    displayName: Validate Azure configuration contract
    dependsOn:
      - DeployFunctions
      - DeployAssetResolver
    condition: succeeded()
    jobs:
      - job: ValidateConfigurationJob
        displayName: Validate App Settings contract
        pool:
          vmImage: windows-latest
        steps:
          # Valida el contrato de app settings de los tres recursos.
          - template: pipelines/templates/steps/validate-configuration.yml
            parameters:
              serviceConnection: '$(AZURE_SERVICE_CONNECTION)'
              resourceGroup: '$(AZURE_RESOURCE_GROUP)'
              functionAppName: '$(AZURE_FUNCTIONS_APP_NAME)'
              adminWebAppName: '$(AZURE_ADMIN_WEB_APP_NAME)'
              assetResolverWebAppName: '$(AZURE_ASSET_RESOLVER_WEB_APP_NAME)'
