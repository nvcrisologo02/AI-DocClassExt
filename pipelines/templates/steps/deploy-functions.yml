# Despliegue del codigo de la Function App (zipDeploy). Los app settings se aplican en
# functions-settings.yml, que se compone justo despues. Procede de DeployFunctionsJob de
# azure-pipelines.yml (799); la pipeline Release lo reutiliza, y su vuelta atras con el zip de la
# foto del codigo (artifactName y packagePath).
parameters:
  - name: serviceConnection
    type: string
  - name: functionAppName
    type: string
  - name: artifactName
    type: string
    default: drop-functions
  - name: packagePath
    type: string
    default: $(Pipeline.Workspace)/drop-functions

steps:
- checkout: self

- download: current
  artifact: ${{ parameters.artifactName }}

- task: AzureFunctionApp@2
  displayName: Deploy Function App
  inputs:
    connectedServiceNameARM: ${{ parameters.serviceConnection }}
    appType: functionApp
    appName: ${{ parameters.functionAppName }}
    package: ${{ parameters.packagePath }}
    deploymentMethod: zipDeploy
